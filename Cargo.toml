[workspace]
resolver = "3"

[workspace.lints.clippy]
let_and_return = "allow"
needless_lifetimes = "allow"
option_if_let_else = "allow"
# see: https://github.com/bevyengine/bevy/pull/15375#issuecomment-2366966219
too_long_first_doc_paragraph = "allow"
missing_panics_doc = "allow"

nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
semicolon_if_nothing_returned = "warn"
type_complexity = "allow"
undocumented_unsafe_blocks = "warn"
unwrap_or_default = "warn"

ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
ref_as_ptr = "warn"

std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"

[workspace.lints.rust]
nonstandard_style = { level = "warn", priority = -1 }
future_incompatible = { level = "warn", priority = -1 }
missing_docs = "warn"
unused = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
rust_2024_compatibility = { level = "warn", priority = -1 }
array_into_iter = "warn"
bare_trait_objects = "warn"
ellipsis_inclusive_range_patterns = "warn"
non_fmt_panics = "warn"
explicit_outlives_requirements = "warn"
unused_extern_crates = "warn"
unexpected_cfgs = { level = "warn" }
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

# Enable more optimization in the release profile at the cost of compile time.
[profile.release]
# Compile the entire crate as one unit.
# Slows compile times, marginal improvements.
# codegen-units = 1
# Do a second optimization pass over the entire program, including dependencies.
# Slows compile times, marginal improvements.
lto = "thin"

# Optimize for size in the wasm-release profile to reduce load times and bandwidth usage on web.
[profile.wasm-release]
# Default to release profile values.
inherits = "release"
# Optimize with size in mind (also try "z", sometimes it is better).
# Slightly slows compile times, great improvements to file size and runtime performance.
opt-level = "s"
# Strip all debugging information from the binary to slightly reduce file size.
strip = "debuginfo"

[package]
name = "image-date-fixer"
version = "0.2.3"
edition = "2024"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/raldone01/image-date-fixer"
repository = "https://github.com/raldone01/image-date-fixer"
readme = "README.md"
description = "Simple tool for fixing wrong modified time stamps and adding missing EXIF data to existing images!"
categories = ["date-and-time"]
keywords = ["image", "exif", "date", "time", "fixer"]

[dependencies]
clap = { version = "4.5", default-features = false, features = [
  "cargo",
  "std",
  "color",
  "help",
  "usage",
  "error-context",
  "suggestions",
  "wrap_help",
] }
thiserror = { version = "2.0", default-features = false, features = [
  "std", # Provides support for backtraces.
] }
tracing = { version = "0.1", default-features = false, features = [
  "std",        # No idea what this changes. It is not required.
  "attributes", # No idea what this changes. It is not required.
] }
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "ansi",       # for color formatting
  "env-filter", # for env filtering
  "fmt",        # for formatting
  "smallvec",   # No idea what this changes. It is not required.
  "std",        # No idea what this changes. It is not required.
] }
chumsky = { version = "0.13", default-features = false, features = [
  "stacker", # Prevents stack overflows.
  "std",     # No idea what this changes. It is not required.
] }
chrono = { version = "0.4", default-features = false, features = [
  "std",
  "clock",
] }
rayon = { version = "1.10", default-features = false }
ctrlc = { version = "3.5.2", default-features = false, features = [
  "termination",
] }
regex = { version = "1.11", default-features = false, features = [
  "unicode-case", # Minimal necessary feature
  "unicode-perl", # Minimal necessary feature
  "unicode",      # Enable all unicode features for safety
  "std",          # Improves performance
  "perf",         # Improves performance further
] }
ariadne = { version = "0.6", default-features = false, features = [
  "auto-color",
] }
nom = { version = "8.0", default-features = false, features = [
  "std", # No idea what this changes. It is not required.
] }
anyhow = { version = "1.0", default-features = false, features = [
  "std", # No idea what this changes. It is not required.
] }
process-wrap = { version = "10.0.1", features = [
  "creation-flags",
  "job-object",
  "process-group",
  "std",
], default-features = false }
dua-core = { version = "6.1.0", features = ["unstable"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Threading"] }

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["-Zunstable-options", "--generate-link-to-definition"]
all-features = true
